    <main>
        <div class="container py-5 px-4">
            <div class="row py-5">
                <div class="loginRegisterForm mx-auto p-4">
                    <h2 class="text-center mb-4">Регистрация</h2>
                    <form action="#">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="last_name" placeholder="Ivanov" required>
                            <label for="last_name">Фамилия</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="first_name" placeholder="Ivan" required>
                            <label for="first_name">Имя</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="email@mail.ru" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" placeholder="qwerty" required>
                            <label for="password">Пароль</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password2" placeholder="qwerty" required>
                            <label for="password2">Повторите пароль</label>
                        </div>
                        <div class="text-center mt-3">
                            <input type="submit" class="btn" value="Зарегистрироваться">
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <span>Вы уже зарегистрированы? <a href="login.html">Авторизация</a></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
